server:
  port: 8080

spring:
  application:
    name: file-api
  datasource:
    url: jdbc:postgresql://localhost:5433/filedb
    username: fileuser
    password: filepass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

aws:
  endpoint: http://localhost:4566
  region: us-east-1
  credentials:
    access-key: test
    secret-key: test
  s3:
    bucket: file-storage

avs:
  url: http://localhost:8081
  timeout-seconds: 30